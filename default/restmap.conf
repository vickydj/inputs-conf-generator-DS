# Endpoint called by input_conf_generator_sh:
#   POST https://<ds>:8089/services/receive_payload
# Callers must authenticate (session key or auth token) and hold the
# input_conf_generator_write capability defined in authorize.conf.
[script:receive_payload]
match = /receive_payload
script = receive_process_payload.py
scripttype = persist
handler = receive_process_payload.ReceivePayloadHandler
requireAuthentication = true
capability = input_conf_generator_write
output_modes = json
passPayload = true
passHttpHeaders = false
passHttpCookies = false
passSystemAuth = false
python.version = python3
python.required = 3.9, 3.13
