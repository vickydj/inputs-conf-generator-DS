# Capability required to call /services/receive_payload (see restmap.conf).
[capability::input_conf_generator_write]

[role_admin]
input_conf_generator_write = enabled

# Least-privilege role for the account whose auth token is configured on the
# search head. It can submit payloads and reload the deployment server, nothing else.
[role_input_conf_generator_sender]
input_conf_generator_write = enabled
list_deployment_server = enabled
edit_deployment_server = enabled
