# Merge gate. Make it required: Settings -> Branches -> rule for "master" ->
# "Require status checks to pass" -> "Validate Splunk app".
name: validate

on:
  pull_request:
  push:
    branches: [master]

permissions:
  contents: read

jobs:
  validate:
    name: Validate Splunk app
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install tools
        run: pip install -q -r ci/requirements.txt "vermin==1.9.2" "uv==0.9.5"

      - name: Lint (secrets, instance state, authentication, TLS)
        run: bash ci/lint.sh

      - name: Tests (Python 3.13 and 3.9)
        run: |
          python -m unittest discover -s tests -v
          # Splunk 9.4 runs 3.9 (python.required). setup-python has no 3.9 for ubuntu-latest (26.04); uv does.
          uv run -q --no-project --python 3.9 --with requests python -m unittest discover -s tests

      - name: Python 3.7 compatible (Splunk 9.0-9.2)
        run: vermin --no-tips --violations -t=3.7- bin/

      - name: Build package
        run: bash ci/build.sh

      - name: Splunk AppInspect and SLIM
        run: bash ci/check.sh

      - name: Upload package and AppInspect report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: splunk-package
          path: |
            dist/*.tgz
            dist/SHA256SUMS
            dist/appinspect.json
          if-no-files-found: ignore
